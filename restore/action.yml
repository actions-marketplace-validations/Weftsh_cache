name: "Weft Cache: restore"
description: Restore a cache from Weft without saving one. The restore half of weftsh/cache.
author: Weft
branding:
  icon: archive
  color: gray-dark

inputs:
  path:
    description: A list of files, directories, and wildcard patterns to restore
    required: true
  key:
    description: An explicit key for restoring the cache
    required: true
  restore-keys:
    description: >-
      An ordered multiline string listing the prefix-matched keys, that are
      used for restoring stale cache if no cache hit occurred for key. Note
      `cache-hit` returns false in this case.
    required: false
  enableCrossOsArchive:
    description: >-
      An optional boolean when enabled, allows windows runners to restore
      caches that were saved on other platforms
    default: "false"
    required: false
  fail-on-cache-miss:
    description: Fail the workflow if cache entry is not found
    default: "false"
    required: false
  lookup-only:
    description: >-
      Check if a cache entry exists for the given input(s) (key, restore-keys)
      without downloading the cache
    default: "false"
    required: false
  token:
    description: >-
      A Weft token with `repo:cache`. Sent as an Authorization header, never
      in a URL. When empty the step reports a miss with a warning.
    required: true
  repository:
    description: >-
      The GitHub repository the cache belongs to, as `owner/name`. Defaults
      to the repository the workflow runs in.
    required: false
    default: ${{ github.repository }}
  api-url:
    description: The Weft deployment.
    required: false
    default: https://api.weft.sh

outputs:
  cache-hit:
    description: A boolean value to indicate an exact match was found for the primary key
  cache-primary-key:
    description: A resolved cache key for which cache match was attempted
  cache-matched-key:
    description: >-
      Key of the cache that was restored, it could either be the primary key
      on cache-hit or a partial/complete match of one of the restore keys

runs:
  using: node20
  main: ../dist/restore-only/index.js
