name: "Weft Cache"
description: Cache dependencies and build outputs on Weft, shared by GitHub-hosted and Weft runners. A drop-in for actions/cache.
author: Weft
branding:
  icon: archive
  color: gray-dark

inputs:
  path:
    description: A list of files, directories, and wildcard patterns to cache and restore
    required: true
  key:
    description: An explicit key for restoring and saving the cache
    required: true
  restore-keys:
    description: >-
      An ordered multiline string listing the prefix-matched keys, that are
      used for restoring stale cache if no cache hit occurred for key. Note
      `cache-hit` returns false in this case.
    required: false
  upload-chunk-size:
    description: >-
      The chunk size used to split up large files during upload, in bytes.
      Archives over 128 MiB are sent in blocks of this size; at most 128 MiB.
    required: false
  enableCrossOsArchive:
    description: >-
      An optional boolean when enabled, allows windows runners to save or
      restore caches that can be restored or saved respectively on other
      platforms
    default: "false"
    required: false
  fail-on-cache-miss:
    description: Fail the workflow if cache entry is not found
    default: "false"
    required: false
  lookup-only:
    description: >-
      Check if a cache entry exists for the given input(s) (key, restore-keys)
      without downloading the cache
    default: "false"
    required: false
  save-always:
    description: Run the post step to save the cache even if another step before fails
    default: "false"
    required: false
    deprecationMessage: |
      save-always does not work as intended and will be removed in a future release.
      A separate `weftsh/cache/save` step should be used instead.
      See https://github.com/actions/cache/tree/main/save#always-save-cache for more details.
  token:
    description: >-
      A Weft token with `repo:cache`. Sent as an Authorization header, never
      in a URL. When empty (a fork's pull request has no secrets) the step
      reports a miss with a warning and the job goes on.
    required: true
  repository:
    description: >-
      The GitHub repository the cache belongs to, as `owner/name`. Defaults
      to the repository the workflow runs in. Jobs on Weft runners for the
      same repository read and write the same cache.
    required: false
    default: ${{ github.repository }}
  api-url:
    description: The Weft deployment.
    required: false
    default: https://api.weft.sh

outputs:
  cache-hit:
    description: A boolean value to indicate an exact match was found for the primary key

runs:
  using: node20
  main: dist/restore/index.js
  post: dist/save/index.js
  post-if: success()
